<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" width="100%" height="auto">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--cw-color)" />
    </marker>
    <marker id="arrow-ccw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--ccw-color)" />
    </marker>

    <!-- Drop Shadow for Center Key -->
    <filter id="key-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="var(--key-shadow)" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    /* SVG Internal Styles (Supports Light/Dark mode automatically) */
    :root {
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --key-bg: #f1f5f9;
      --key-border: #cbd5e1;
      --key-shadow: rgba(0, 0, 0, 0.1);
      --cw-color: #059669;
      --cw-bg: #ecfdf5;
      --ccw-color: #d97706;
      --ccw-bg: #fffbeb;
      --line-color: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: #1e293b;
        --card-border: #334155;
        --key-bg: #334155;
        --key-border: #475569;
        --key-shadow: rgba(0, 0, 0, 0.4);
        --cw-color: #34d399;
        --cw-bg: rgba(16, 185, 129, 0.15);
        --ccw-color: #fbbf24;
        --ccw-bg: rgba(245, 158, 11, 0.15);
        --line-color: #475569;
      }
    }

    .text-main { fill: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
    .text-muted { fill: var(--text-muted); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
    .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    
    .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.5; rx: 8; transition: all 0.2s; }
    .card:hover { stroke-width: 2.5; }
    
    .cw-bg { fill: var(--cw-bg); stroke: var(--cw-color); stroke-width: 1.5; rx: 6; }
    .ccw-bg { fill: var(--ccw-bg); stroke: var(--ccw-color); stroke-width: 1.5; rx: 6; }
    
    .cw-text { fill: var(--cw-color); font-weight: 700; font-size: 14px; }
    .ccw-text { fill: var(--ccw-color); font-weight: 700; font-size: 14px; }
    
    .gesture-line { stroke: var(--line-color); stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
    
    .key-base { fill: var(--key-bg); stroke: var(--key-border); stroke-width: 2; rx: 16; filter: url(#key-shadow); }
    .key-text { fill: var(--text-main); font-size: 48px; font-weight: 700; font-family: system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    
    .legend-box { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1; rx: 6; }
  </style>

  <!-- Connecting Dotted Lines -->
  <path class="gesture-line" d="M 360 235 L 260 140" />
  <path class="gesture-line" d="M 440 235 L 540 140" />
  <path class="gesture-line" d="M 360 315 L 260 410" />
  <path class="gesture-line" d="M 440 315 L 540 410" />

  <!-- CENTER KEY -->
  <g transform="translate(350, 225)">
    <rect class="key-base" width="100" height="100" />
    <text class="key-text" x="50" y="52">k</text>
    <text class="text-muted" x="50" y="125" text-anchor="middle" font-weight="600">Base Key</text>
  </g>

  <!-- NORTH-WEST QUADRANT -->
  <g transform="translate(40, 40)">
    <text class="text-main" x="110" y="0" text-anchor="middle" font-weight="700" font-size="16">North-West (NW)</text>
    
    <!-- CW -->
    <g transform="translate(0, 20)">
      <rect class="cw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 1 35 35" fill="none" stroke="var(--cw-color)" stroke-width="2.5" marker-end="url(#arrow-cw)"/>
      <text class="cw-text text-main" x="50" y="60" text-anchor="middle">o <tspan class="text-muted" font-weight="400">(ko)</tspan></text>
    </g>
    
    <!-- CCW -->
    <g transform="translate(120, 20)">
      <rect class="ccw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 0 65 35" fill="none" stroke="var(--ccw-color)" stroke-width="2.5" marker-end="url(#arrow-ccw)"/>
      <text class="ccw-text text-main" x="50" y="55" text-anchor="middle" font-size="12">Ctrl+Shift</text>
      <text class="text-muted" x="50" y="70" text-anchor="middle" font-size="11">(Ctrl+Shift+k)</text>
    </g>
  </g>

  <!-- NORTH-EAST QUADRANT -->
  <g transform="translate(540, 40)">
    <text class="text-main" x="110" y="0" text-anchor="middle" font-weight="700" font-size="16">North-East (NE)</text>
    
    <!-- CW -->
    <g transform="translate(0, 20)">
      <rect class="cw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 1 35 35" fill="none" stroke="var(--cw-color)" stroke-width="2.5" marker-end="url(#arrow-cw)"/>
      <text class="cw-text text-main" x="50" y="60" text-anchor="middle">e <tspan class="text-muted" font-weight="400">(ke)</tspan></text>
    </g>
    
    <!-- CCW -->
    <g transform="translate(120, 20)">
      <rect class="ccw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 0 65 35" fill="none" stroke="var(--ccw-color)" stroke-width="2.5" marker-end="url(#arrow-ccw)"/>
      <text class="ccw-text text-main" x="50" y="55" text-anchor="middle">Shift</text>
      <text class="text-muted" x="50" y="70" text-anchor="middle" font-size="11">(K)</text>
    </g>
  </g>

  <!-- SOUTH-WEST QUADRANT -->
  <g transform="translate(40, 380)">
    <text class="text-main" x="110" y="115" text-anchor="middle" font-weight="700" font-size="16">South-West (SW)</text>
    
    <!-- CW -->
    <g transform="translate(0, 20)">
      <rect class="cw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 1 35 35" fill="none" stroke="var(--cw-color)" stroke-width="2.5" marker-end="url(#arrow-cw)"/>
      <text class="cw-text text-main" x="50" y="60" text-anchor="middle">a <tspan class="text-muted" font-weight="400">(ka)</tspan></text>
    </g>
    
    <!-- CCW -->
    <g transform="translate(120, 20)">
      <rect class="ccw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 0 65 35" fill="none" stroke="var(--ccw-color)" stroke-width="2.5" marker-end="url(#arrow-ccw)"/>
      <text class="ccw-text text-main" x="50" y="60" text-anchor="middle">u <tspan class="text-muted" font-weight="400">(ku)</tspan></text>
    </g>
  </g>

  <!-- SOUTH-EAST QUADRANT -->
  <g transform="translate(540, 380)">
    <text class="text-main" x="110" y="115" text-anchor="middle" font-weight="700" font-size="16">South-East (SE)</text>
    
    <!-- CW -->
    <g transform="translate(0, 20)">
      <rect class="cw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 1 35 35" fill="none" stroke="var(--cw-color)" stroke-width="2.5" marker-end="url(#arrow-cw)"/>
      <text class="cw-text text-main" x="50" y="60" text-anchor="middle">i <tspan class="text-muted" font-weight="400">(ki)</tspan></text>
    </g>
    
    <!-- CCW -->
    <g transform="translate(120, 20)">
      <rect class="ccw-bg" width="100" height="80" />
      <path d="M 50 20 A 15 15 0 1 0 65 35" fill="none" stroke="var(--ccw-color)" stroke-width="2.5" marker-end="url(#arrow-ccw)"/>
      <text class="ccw-text text-main" x="50" y="55" text-anchor="middle">Ctrl</text>
      <text class="text-muted" x="50" y="70" text-anchor="middle" font-size="11">(Ctrl+k)</text>
    </g>
  </g>

  <!-- LEGEND -->
  <g transform="translate(250, 510)">
    <rect class="legend-box" x="0" y="0" width="14" height="14" />
    <circle cx="7" cy="7" r="4" fill="var(--cw-color)" />
    <text class="text-main" x="22" y="11" font-size="13" font-weight="600">Clockwise (Vowel Append)</text>
    
    <rect class="legend-box" x="180" y="0" width="14" height="14" />
    <circle cx="187" cy="7" r="4" fill="var(--ccw-color)" />
    <text class="text-main" x="202" y="11" font-size="13" font-weight="600">Anti-Clockwise (Modifier)</text>
  </g>

</svg>
